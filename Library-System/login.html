<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <script defer src="js/login.js"></script>
</head>
<body>

<div id="authWrapper">

    <div id="authContainer">

        <!-- LEFT SIDE DESIGN -->
        <div id="authLeft">
            <h1>Welcome to</h1>
            <h2>BookNest</h2>
            <p>Your Smart Library Companion</p>
            <button id="Btn">Switch to Sign Up</button>
        </div>

        <!-- RIGHT SIDE FORM -->
        <div id="authRight">

            <!-- LOGIN FORM -->
            <form id="loginForm" class="formBox">

                <h2>Login</h2>

                <input type="text" placeholder="Email or Library ID" required>

                <input type="password" placeholder="Password" required>

                <input type="password" placeholder="Confirm Password" required>

                <a href="#" class="forgot">Forgot Password?</a>

                <button type="submit" class="primaryBtn">Login</button>

            </form>

            <!-- SIGN UP FORM -->
            <form id="signupForm" class="formBox hidden">

                <h2>Sign Up</h2>

                <input type="text" placeholder="Full Name" required>

                <input type="email" placeholder="Email" required>

                <input type="password" placeholder="Password" required>

                <input type="password" placeholder="Confirm Password" required>

                <button type="submit" class="primaryBtn">Sign Up</button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
