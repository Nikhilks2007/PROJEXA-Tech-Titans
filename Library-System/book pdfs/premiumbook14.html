<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium Book</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(to right, #141e30, #243b55);
    margin:0;
    padding:0;
}

.container{
    width: 350px;
    margin: 80px auto;
    background: white;
    border-radius: 15px;
    box-shadow: 0px 0px 15px black;
    text-align: center;
    padding: 20px;
}

.book-img{
    width: 200px;
    height: 260px;
    object-fit: cover;
    border-radius: 10px;
}

.premium{
    background: gold;
    color: black;
    padding: 5px 10px;
    border-radius: 20px;
    font-weight: bold;
    display: inline-block;
    margin-top: 10px;
}

.price{
    font-size: 28px;
    color: green;
    margin: 15px 0;
    font-weight: bold;
}

button{
    background: #ff4b2b;
    color: white;
    border: none;
    padding: 12px 25px;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover{
    background: #ff1e00;
}
</style>

</head>

<body>

<div class="container">
    
    <img src="http://127.0.0.1:5500/Library-System/assets/images/book14.jpg" alt="" class="book-img">

    <h2>Destiny Of Souls</h2>

    <div class="premium">⭐ Premium</div>

    <p>Author: John Smith</p>

    <div class="price">₹499</div>

    <button onclick="buyBook()">Buy Now</button>

</div>

<script>
function buyBook(){
    alert("Payment page par redirect ho rahe ho...");
    window.location.href = "payment.html";
}
</script>

</body>
</html>
